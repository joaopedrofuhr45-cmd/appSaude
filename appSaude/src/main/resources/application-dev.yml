# Banco local em memória. As migrations Flyway usam sintaxe específica do PostgreSQL;
# neste perfil, o Hibernate cria e atualiza o schema pelas entidades.
spring:
  datasource:
    url: jdbc:h2:mem:appsaude;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  sql:
    init:
      mode: always

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:dev-only-secret-key-change-before-production-1234567890}
