# Banco local em memória. As migrations Flyway usam sintaxe específica do PostgreSQL;
# neste perfil, o Hibernate cria e atualiza o schema pelas entidades.
spring:
  datasource:
    url: jdbc:h2:mem:appsaude;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  sql:
    init:
      mode: always

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:dev-only-secret-key-change-before-production-1234567890}
  test-accounts:
    enabled: ${APP_TEST_ACCOUNTS_ENABLED:true}
    attendant-cpf: ${APP_TEST_ATENDENTE_CPF:99900000001}
    attendant-password: ${APP_TEST_ATENDENTE_PASSWORD:AtendenteTeste2026!}
    doctor-cpf: ${APP_TEST_MEDICO_CPF:99900000002}
    doctor-password: ${APP_TEST_MEDICO_PASSWORD:MedicoTeste2026!}
    patient-cpf: ${APP_TEST_PACIENTE_CPF:99900000003}
    patient-password: ${APP_TEST_PACIENTE_PASSWORD:PacienteTeste2026!}
