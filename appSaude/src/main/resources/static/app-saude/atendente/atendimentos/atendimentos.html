<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimentos | Saúde+</title>
    <link rel="stylesheet" href="../../recursos/css/style-global.css">
    <link rel="stylesheet" href="../../recursos/css/dashboard-staff.css">
    <link rel="stylesheet" href="atendimentos.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><i class="fa-regular fa-heart"></i> Saúde<span>+</span></div>
        <div class="who">
            <strong id="sidebar-nome">Carregando...</strong>
            <span id="sidebar-subtitulo"></span>
        </div>
        <nav>
            <a href="atendimentos.html" class="ativo"><span class="dot"></span> Atendimentos</a>
            <a href="../configuracoes-atendente/configuracoes-atendente.html"><span class="dot"></span> Configurações</a>
        </nav>
        <hr class="divider">
        <button class="logout" id="btn-logout">Sair da conta</button>
    </aside>

    <main class="dashboard-content">
        <div class="topbar">
            <a href="../../telas-comuns/menu-inicial/menu_inicial.html" class="voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao menu inicial
            </a>
            <div class="topbar-actions">
                <button class="icon-btn" title="Notificações"><i class="fa-regular fa-bell"></i></button>
                <button class="btn-primary" id="btn-novo-agendamento">
                    <i class="fa-solid fa-plus"></i> Novo agendamento
                </button>
            </div>
        </div>

        <h1 class="page-title">Atendimentos</h1>
        <p class="page-subtitle">Todas as consultas do hospital na data selecionada.</p>

        <section class="panel card-filters">
            <div class="campo">
                <label for="filtro-data">Data</label>
                <input type="date" id="filtro-data">
            </div>
            <div class="campo">
                <label for="filtro-paciente">Buscar paciente</label>
                <input type="text" id="filtro-paciente" placeholder="Nome do paciente">
            </div>
            <div class="campo">
                <label for="filtro-situacao">Situação</label>
                <select id="filtro-situacao">
                    <option value="">Todas</option>
                    <option value="PENDENTE">Agendado</option>
                    <option value="CONFIRMADA">Confirmado</option>
                    <option value="REALIZADA">Finalizado</option>
                    <option value="CANCELADA">Cancelado</option>
                </select>
            </div>
        </section>

        <section class="stats-row">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-regular fa-calendar"></i></div>
                <p class="stat-valor" id="stat-total">–</p>
                <p class="stat-label">consultas no dia</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-check"></i></div>
                <p class="stat-valor" id="stat-agendadas">–</p>
                <p class="stat-label">agendadas</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-regular fa-clock"></i></div>
                <p class="stat-valor" id="stat-proximo">–</p>
                <p class="stat-label">próximo horário</p>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2 id="titulo-agenda">Agenda</h2>
                <button class="link" id="btn-exportar">Exportar lista</button>
            </div>
            <div class="rows" id="lista-atendimentos">
                <div class="estado">Carregando atendimentos...</div>
            </div>
        </section>
    </main>
</div>

<script type="module" src="atendimentos.js"></script>
</body>
</html>
