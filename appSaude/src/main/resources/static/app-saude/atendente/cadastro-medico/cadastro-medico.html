<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar médico | Saúde+</title>
    <link rel="stylesheet" href="../../recursos/css/style-global.css">
    <link rel="stylesheet" href="../../recursos/css/dashboard-staff.css">
    <link rel="stylesheet" href="cadastro-medico.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><i class="fa-regular fa-heart"></i> Saúde<span>+</span></div>
        <div class="who">
            <strong id="sidebar-nome">Carregando...</strong>
            <span id="sidebar-subtitulo"></span>
        </div>
        <nav>
            <a href="../atendimentos/atendimentos.html"><span class="dot"></span> Atendimentos</a>
            <a href="cadastro-medico.html" class="ativo"><span class="dot"></span> Cadastrar médico</a>
            <a href="../configuracoes-atendente/configuracoes-atendente.html"><span class="dot"></span> Configurações</a>
        </nav>
        <hr class="divider">
        <button class="logout" id="btn-logout">Sair da conta</button>
    </aside>

    <main class="dashboard-content">
        <div class="topbar">
            <a href="../atendimentos/atendimentos.html" class="voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar para atendimentos
            </a>

        </div>

        <h1 class="page-title">Cadastrar médico</h1>
        <p class="page-subtitle">Adicione um profissional e crie o acesso dele ao Saúde+.</p>

        <section class="panel cadastro-panel">
            <div class="panel-header">
                <h2>Dados do profissional</h2>
            </div>
            <form id="form-medico">
                <div class="form-grid">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" maxlength="155" autocomplete="name" required>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="11"
                               pattern="[0-9]{11}" placeholder="Somente números" autocomplete="off" required>
                    </div>
                    <div class="campo">
                        <label for="especialidade">Especialidade</label>
                        <select id="especialidade" name="especialidade" required>
                            <option value="">Carregando especialidades...</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="crm">CRM</label>
                        <input type="text" id="crm" name="crm" maxlength="20" placeholder="Ex.: CRM-SP 123456" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" maxlength="150" autocomplete="email" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone <span class="opcional">(opcional)</span></label>
                        <input type="tel" id="telefone" name="telefone" maxlength="20" placeholder="(11) 98765-4321" autocomplete="tel">
                    </div>
                    <div class="campo">
                        <label for="senha">Senha inicial</label>
                        <input type="password" id="senha" name="senha" minlength="8" maxlength="72" autocomplete="new-password" required>
                    </div>
                    <div class="campo">
                        <label for="confirmar-senha">Confirmar senha inicial</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" minlength="8" maxlength="72" autocomplete="new-password" required>
                    </div>
                </div>

                <p class="dica-senha">A senha deve ter pelo menos 8 caracteres. O médico poderá alterá-la nas configurações da conta.</p>
                <p class="estado mensagem" id="mensagem" role="status" aria-live="polite" hidden></p>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="btn-cadastrar">
                        <i class="fa-solid fa-user-plus"></i> Cadastrar médico
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>

<script type="module" src="cadastro-medico.js"></script>
</body>
</html>
