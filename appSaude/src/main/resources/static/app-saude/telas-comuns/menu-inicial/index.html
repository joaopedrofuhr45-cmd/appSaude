<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Saúde</title>
  <link rel="stylesheet" href="../../recursos/css/style-global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="box">
    <section class="logo">
      <div class="logo-icon">
        <img src="../../img/saude_coracao.svg" alt="Coração">
      </div>
      <h1 class="title">App Saúde</h1>
      <p>Escolha como deseja acessar</p>
    </section>

    <section class="list">
      <div >
      <a href="../login/index.html " class="card highlight">
        <div class="icon">
          <img src="../../img/user-usuario.svg" alt="">
        </div>
        <div class="text">
          <h2>Sou Paciente</h2>
          <p>Criar minha conta e agendar consultas</p>
        </div>
      </a>
      </div>

      <div>
      <a href="../login/index.html" class="card">
        <div class="icon">
          <img src="../../img/user-medico.svg" alt="">
        </div>
        <div class="text">
          <h2>Sou Médico</h2>
          <p>Acessar minha agenda de consultas</p>
        </div>
      </a>
      </div>

      <div>
      <a href="../login/index.html" class="card">
        <div class="icon">
          <img src="../../img/user-atendente.svg" alt="">
        </div>
        <div class="text">
          <h2>Sou Atendente</h2>
          <p>Gerenciar consultas do dia</p>
        </div>
      </a>
      </div>

    </section>

  </main>
</body>
</html>
