<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login da equipe | Saúde+</title>

    <link rel="stylesheet" href="../../recursos/css/style-global.css" />
    <link rel="stylesheet" href="login-medico-atendente.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
<header class="topo">
    <a href="../menu-inicial/menu_inicial.html" class="botao-voltar">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Voltar</span>
    </a>
    <div class="logo">Saúde<span class="mais">+</span></div>
</header>

<main class="login-screen">
    <div class="login-illustration">
        <img src="../../recursos/img/saude_em_um_so_lugar.png" alt="Sua saúde em um só lugar" />
    </div>

    <div class="login-card">
        <div class="login-tag"><i class="fa-solid fa-user"></i> Acesso da equipe</div>

        <h1 class="login-title">Entrar na sua conta</h1>
        <p class="login-subtitle">Use o CPF cadastrado na recepção.</p>

        <form id="loginForm">
            <div class="login-field">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" />
            </div>

            <div class="login-field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" />
            </div>

            <p id="mensagem" class="login-error"></p>

            <button type="submit" class="login-submit">Entrar</button>
        </form>

        <p class="login-footer">
            Problemas para acessar? <a href="#">Falar com o suporte</a>
        </p>
    </div>
</main>

<script type="module" src="login-medico-atendente.js"></script>
</body>
</html>
