<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>
    <!-- header padrão do projeto -->
    <header class="topo">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>Saúde<span class="mais">+</span></span>
        </div>
    </header>

    <main>
        <section class="principal">
            <div class="imagem">
                <img src="../../recursos/img/saude_em_um_so_lugar.png"
                    alt="sua saúde em um só lugar">
            </div>

            <div class="login">
                <div class="form-prin">
                    <h1 class="title">Entrar na sua conta</h1>
                    <p>Acesso sua área de saúde</p>

                    <form id="loginForm">
                        <div class="form">
                            <input type="text" id="cpf" name="cpf" placeholder="CPF">
                        </div>

                        <div class="form">
                            <input type="password" id="senha" name="senha" placeholder="Senha">
                        </div>

                        <p id="mensagem" class="mensagem-erro"></p>

                        <button type="submit" class="btn">Entrar</button>
                    </form>

                    <div class="voltar">
                        <p id="criar-conta">não tem uma conta? <a href="#">Criar conta</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>

</body>

</html>
