<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento | Saúde+</title>
    <link rel="stylesheet" href="../../recursos/css/style-global.css">
    <link rel="stylesheet" href="../../recursos/css/dashboard-staff.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><i class="fa-regular fa-heart"></i> Saúde<span>+</span></div>
        <div class="who">
            <strong id="sidebar-nome">Carregando...</strong>
            <span id="sidebar-subtitulo"></span>
        </div>
        <nav>
            <a href="../consultas-do-dia/index.html"><span class="dot"></span> Consultas do dia</a>
            <a href="../configuracoes-medico/index.html"><span class="dot"></span> Configurações</a>
        </nav>
        <hr class="divider">
        <button class="logout" id="btn-logout">Sair da conta</button>
    </aside>

    <main class="dashboard-content">
        <div class="topbar">
            <a href="../consultas-do-dia/index.html" class="voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar para consultas do dia
            </a>
            <div class="topbar-actions">
                <span class="chip"><i class="fa-regular fa-clock"></i> <span id="tempo-atendimento">Em atendimento</span></span>
                <button class="icon-btn" title="Notificações"><i class="fa-regular fa-bell"></i></button>
            </div>
        </div>

        <h1 class="page-title" id="titulo-atendimento">Atendimento</h1>
        <p class="page-subtitle">Registre a evolução e finalize quando terminar a consulta.</p>

        <div class="cols">
            <div class="col-main">
                <section class="panel">
                    <h2 style="margin: 0 0 14px;">Prontuário</h2>
                    <div class="prontuario-blocks">
                        <div class="bloco-prontuario">
                            <strong>Queixa principal</strong>
                            <textarea id="queixa-principal" rows="2" placeholder="Descreva a queixa principal..."></textarea>
                        </div>
                        <div class="bloco-prontuario">
                            <strong>Histórico clínico</strong>
                            <textarea id="historico-clinico" rows="3" placeholder="Histórico relevante, alergias, comorbidades..."></textarea>
                        </div>
                        <div class="bloco-prontuario">
                            <strong>Exame físico</strong>
                            <textarea id="exame-fisico" rows="3" placeholder="PA, FC, estado geral..."></textarea>
                        </div>
                        <div class="bloco-prontuario">
                            <strong>Observações</strong>
                            <textarea id="observacoes" rows="2" placeholder="Digite suas observações..."></textarea>
                        </div>
                    </div>
                </section>
            </div>

            <div class="col-side">
                <section class="panel card-person">
                    <div class="person">
                        <div class="avatar"><i class="fa-solid fa-user"></i></div>
                        <div class="nome-sub">
                            <strong id="pessoa-nome">–</strong>
                            <span id="pessoa-sub">–</span>
                        </div>
                    </div>
                    <div class="mini-row"><span>Convênio</span><span id="mini-convenio">–</span></div>
                    <div class="mini-row"><span>Horário</span><span id="mini-horario">–</span></div>
                    <div class="mini-row"><span>Situação</span><span id="mini-situacao">–</span></div>
                </section>

                <section class="panel">
                    <h2 style="margin: 0 0 14px;">Ações</h2>
                    <div class="actions">
                        <button class="btn-outline-block" id="btn-receita" disabled title="Ainda não implementado">
                            <i class="fa-regular fa-file-lines"></i> Emitir receita
                        </button>
                        <button class="btn-primary-block" id="btn-finalizar">
                            <i class="fa-solid fa-check"></i> Finalizar consulta
                        </button>
                    </div>
                    <p class="estado" id="mensagem-atendimento" style="display:none;"></p>
                </section>
            </div>
        </div>
    </main>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
