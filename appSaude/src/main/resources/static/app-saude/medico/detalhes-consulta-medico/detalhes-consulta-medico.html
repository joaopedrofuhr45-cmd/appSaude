<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados da consulta | Saúde+</title>
    <link rel="stylesheet" href="../../recursos/css/style-global.css">
    <link rel="stylesheet" href="../../recursos/css/dashboard-staff.css">
    <link rel="stylesheet" href="detalhes-consulta-medico.css">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo"><i class="fa-regular fa-heart"></i> Saúde<span>+</span></div>
            <div class="who">
                <strong id="sidebar-nome">Carregando...</strong>
                <span id="sidebar-subtitulo"></span>
            </div>
            <nav>
                <a href="../consultas-do-dia/consultas-do-dia.html"><span class="dot"></span> Consultas do dia</a>
                <a href="../configuracoes-medico/configuracoes-medico.html"><span class="dot"></span> Configurações</a>
            </nav>
            <hr class="divider">
            <button class="logout" id="btn-logout">Sair da conta</button>
        </aside>

        <main class="dashboard-content">
            <div class="topbar">
                <a href="../consultas-do-dia/consultas-do-dia.html" class="voltar">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para consultas do dia
                </a>
                <div class="topbar-actions">
                    <button class="icon-btn" title="Notificações"><i class="fa-regular fa-bell"></i></button>
                </div>
            </div>

            <h1 class="page-title">Dados da consulta</h1>
            <p class="page-subtitle" id="subtitulo-consulta">Carregando...</p>

            <div class="cols">
                <div class="col-main">
                    <section class="panel">
                        <h2 style="margin: 0 0 14px;">Informações</h2>
                        <div class="pairs-row">
                            <div class="pair">
                                <div class="bubble"><i class="fa-solid fa-user"></i></div>
                                <div class="kv"><span>Paciente</span><strong id="info-paciente">–</strong></div>
                            </div>
                            <div class="pair">
                                <div class="bubble"><i class="fa-solid fa-user-doctor"></i></div>
                                <div class="kv"><span>Médico</span><strong id="info-medico">–</strong></div>
                            </div>
                        </div>
                        <div class="pairs-row">
                            <div class="pair">
                                <div class="bubble"><i class="fa-solid fa-hospital"></i></div>
                                <div class="kv"><span>Especialidade</span><strong id="info-especialidade">–</strong>
                                </div>
                            </div>
                            <div class="pair">
                                <div class="bubble"><i class="fa-regular fa-calendar"></i></div>
                                <div class="kv"><span>Data e hora</span><strong id="info-data-hora">–</strong></div>
                            </div>
                        </div>
                        <div class="pairs-row">
                            <div class="pair">
                                <div class="bubble"><i class="fa-regular fa-credit-card"></i></div>
                                <div class="kv"><span>Convênio</span><strong id="info-convenio">–</strong></div>
                            </div>
                            <div class="pair">
                                <div class="bubble"><i class="fa-solid fa-check"></i></div>
                                <div class="kv"><span>Situação</span><span class="pill" id="info-situacao">–</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="panel">
                        <h2 style="margin: 0 0 14px;">Observação</h2>
                        <div class="obs-box" id="info-observacao">Nenhuma observação registrada.</div>
                    </section>
                </div>

                <div class="col-side">
                    <section class="panel card-person">
                        <div class="person">
                            <div class="avatar"><i class="fa-solid fa-user"></i></div>
                            <div class="nome-sub">
                                <strong id="pessoa-nome">–</strong>
                                <span id="pessoa-sub">–</span>
                            </div>
                        </div>
                        <div class="mini-row"><span>Convênio</span><span id="mini-convenio">–</span></div>
                        <div class="mini-row"><span>Consulta</span><span id="mini-tipo">–</span></div>
                        <div class="mini-row"><span>Unidade</span><span id="mini-unidade">–</span></div>
                    </section>

                    <section class="panel">
                        <h2 style="margin: 0 0 14px;">Ações</h2>
                        <div class="actions">
                            <button class="btn-primary-block" id="btn-iniciar-atendimento">
                                Iniciar atendimento
                            </button>
                            <button class="btn-outline-block" id="btn-editar" disabled title="Ainda não implementado">
                                Editar consulta
                            </button>
                            <button class="btn-danger-block" id="btn-cancelar">
                                Cancelar consulta
                            </button>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="detalhes-consulta-medico.js"></script>
</body>

</html>
