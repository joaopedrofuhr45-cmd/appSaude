<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendar consulta | Saúde+</title>
    <link rel="stylesheet" href="../../recursos/css/style-global.css" />
    <link rel="stylesheet" href="agendar-consulta.css" />
  </head>

  <body class="booking-page">
    <main class="booking-content">
      <div class="topbar">
        <a href="../../telas-comuns/menu-inicial/menu_inicial.html" class="voltar">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar ao menu inicial
        </a>
        <div class="topbar-actions">
          <button class="icon-btn" type="button" title="Notificações" aria-label="Notificações">
            <i class="fa-regular fa-bell" aria-hidden="true"></i>
          </button>
          <a href="agendar-consulta.html" class="btn-primary">
            <i class="fa-solid fa-plus" aria-hidden="true"></i> Nova consulta
          </a>
        </div>
      </div>

      <h1 class="page-title" id="pagina-titulo">Agendar consulta</h1>
      <p class="page-subtitle" id="pagina-subtitulo">
        Escolha a especialidade, o profissional e o melhor horário para atendimento.
      </p>

      <section class="panel booking-panel">
        <form id="form-agendar">
          <div class="campo-linha">
            <div class="campo">
              <label for="especialidade">Especialidade</label>
              <select id="especialidade" name="especialidade" required>
                <option value="">Selecione</option>
                <option value="Clínico geral">Clínico geral</option>
                <option value="Cardiologia">Cardiologia</option>
                <option value="Oftalmologia">Oftalmologia</option>
                <option value="Pediatria">Pediatria</option>
              </select>
            </div>
            <div class="campo">
              <label for="medico">Médico</label>
              <select id="medico" name="medico" required>
                <option value="">Selecione o médico</option>
              </select>
            </div>
          </div>

          <div class="campo calendar-field">
            <label>Data</label>
            <div class="calendar-toolbar">
              <button class="calendar-nav" type="button" id="semana-anterior" aria-label="Semana anterior">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
              </button>
              <strong id="mes-atual" aria-live="polite"></strong>
              <div class="calendar-actions">
                <button class="calendar-nav" type="button" id="proxima-semana" aria-label="Próxima semana">
                  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
                <button class="today-button" type="button" id="ir-hoje">Hoje</button>
              </div>
            </div>
            <div class="week-days" id="dias-semana" role="group" aria-label="Escolha o dia"></div>
            <input type="date" id="data" name="data" tabindex="-1" aria-hidden="true" />
          </div>

          <div class="campo time-field">
            <label>Horário</label>
            <div class="time-period">
              <span>Manhã</span>
              <div class="time-slots" id="horarios-manha" role="group" aria-label="Horários da manhã"></div>
            </div>
            <div class="time-period">
              <span>Tarde</span>
              <div class="time-slots" id="horarios-tarde" role="group" aria-label="Horários da tarde"></div>
            </div>
            <input type="time" id="horario" name="horario" tabindex="-1" aria-hidden="true" />
          </div>

          <div class="campo observation-field">
            <label for="observacao">Observação</label>
            <textarea
              id="observacao"
              name="observacao"
              rows="3"
              placeholder="Descreva rapidamente o motivo da consulta"
            ></textarea>
          </div>

          <button type="submit" class="btn-primary btn-full" id="btn-solicitar">
            <i class="fa-regular fa-calendar-check" aria-hidden="true"></i> Solicitar agendamento
          </button>

          <p class="estado" id="mensagem-agendamento" style="display: none"></p>
        </form>
      </section>
    </main>

    <script type="module" src="agendar-consulta.js"></script>
  </body>
</html>
