<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendar consulta | Saúde+</title>
    <link rel="stylesheet" href="../../recursos/css/style-global.css" />
    <link rel="stylesheet" href="../../recursos/css/dashboard-paciente.css" />
    <link rel="stylesheet" href="../../recursos/css/week-calendar.css" />
    <link rel="stylesheet" href="agendar-consulta.css" />
  </head>

  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-regular fa-heart"></i> Saúde<span>+</span>
        </div>

        <div class="patient-card">
          <strong id="sidebar-nome">Carregando...</strong>
          <span id="sidebar-desde"></span>
        </div>

        <nav>
          <a href="../inicio/inicio.html"><span class="dot"></span> Início</a>
          <a href="agendar-consulta.html" class="ativo"
            ><span class="dot"></span> Agendar consulta</a
          >
          <a href="../historico/historico.html"
            ><span class="dot"></span> Histórico</a
          >
          <a href="../configuracoes/configuracoes.html"
            ><span class="dot"></span> Configurações</a
          >
        </nav>

        <hr class="divider" />
        <button class="logout" id="btn-logout">Sair da conta</button>
      </aside>

      <main class="dashboard-content">
        <div class="topbar">
          <a
            href="../../telas-comuns/menu-inicial/menu_inicial.html"
            class="voltar"
          >
            <i class="fa-solid fa-arrow-left"></i> Voltar ao menu inicial
          </a>
          <div class="topbar-actions">
            <button class="icon-btn" title="Notificações">
              <i class="fa-regular fa-bell"></i>
            </button>
            <a href="agendar-consulta.html" class="btn-primary">
              <i class="fa-solid fa-plus"></i> Nova consulta
            </a>
          </div>
        </div>

        <h1 class="page-title" id="pagina-titulo">Agendar consulta</h1>
        <p class="page-subtitle" id="pagina-subtitulo">
          Escolha a especialidade, o profissional e o melhor horário para
          atendimento.
        </p>
        <section class="panel booking-panel">
          <form id="form-agendar">
            <div class="campo-linha">
              <div class="campo">
                <label for="especialidade">Especialidade</label>
                <select id="especialidade" name="especialidade" required>
                  <option value="">Selecione</option>
                  <option value="Clínico geral">Clínico geral</option>
                  <option value="Cardiologia">Cardiologia</option>
                  <option value="Oftalmologia">Oftalmologia</option>
                  <option value="Pediatria">Pediatria</option>
                </select>
              </div>
              <div class="campo">
                <label for="medico">Médico</label>
                <select id="medico" name="medico" required>
                  <option value="">Selecione o médico</option>
                </select>
              </div>
            </div>

            <div class="campo campo-calendario">
              <label>Data</label>
              <input type="hidden" id="data" name="data" />
              <div class="week-calendar" aria-label="Escolha a data da consulta">
                <div class="week-calendar__toolbar">
                  <button class="week-calendar__nav" id="calendario-anterior" type="button" aria-label="Semana anterior">
                    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                  </button>
                  <h2 class="week-calendar__month" id="calendario-mes" aria-live="polite"></h2>
                  <div class="week-calendar__actions">
                    <button class="week-calendar__nav" id="calendario-proximo" type="button" aria-label="Próxima semana">
                      <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                    </button>
                    <button class="week-calendar__today" id="calendario-hoje" type="button">Hoje</button>
                  </div>
                </div>
                <div class="week-calendar__days" id="calendario-dias" role="group" aria-label="Dias da semana"></div>
              </div>
            </div>

            <div class="campo campo-horarios" role="group" aria-labelledby="rotulo-horario">
              <span class="campo-label" id="rotulo-horario">Horário</span>
              <input type="hidden" id="horario" name="horario" />
              <div class="horario-periodo" role="group" aria-labelledby="rotulo-manha">
                <h3 class="horario-periodo__titulo" id="rotulo-manha">Manhã</h3>
                <div class="horarios-lista" id="horarios-manha"></div>
              </div>
              <div class="horario-periodo" role="group" aria-labelledby="rotulo-tarde">
                <h3 class="horario-periodo__titulo" id="rotulo-tarde">Tarde</h3>
                <div class="horarios-lista" id="horarios-tarde"></div>
              </div>
            </div>

            <div class="campo">
              <label for="observacao">Observação</label>
              <textarea
                id="observacao"
                name="observacao"
                rows="3"
                placeholder="Descreva rapidamente o motivo da consulta"
              ></textarea>
            </div>

            <button
              type="submit"
              class="btn-primary btn-full"
              id="btn-solicitar"
            >
              <i class="fa-regular fa-calendar-check"></i> Solicitar agendamento
            </button>

            <p
              class="estado"
              id="mensagem-agendamento"
              style="display: none"
            ></p>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="agendar-consulta.js"></script>
  </body>
</html>
