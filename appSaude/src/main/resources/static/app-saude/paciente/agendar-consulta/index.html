<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Saúde</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../recursos/css/style-global.css">
</head>
<body>
<div class="caixa-total">

    <div class="content">
        <div class="header">
            <h1>Agendar Consulta</h1>
        </div>

        <div class="field">
            <label for="especialidade">Especialidade</label>
            <div class="select-box">
                <span id="especialidade">Clínica Geral</span>
            </div>
        </div>

        <div class="field">
            <label for="medico">Médico</label>
            <div class="select-box">
                <span id="medico">Dr. Carlos</span>
            </div>
        </div>
        <div class="field">
            <label for="data">Data</label>
            <div class="select-box">
                <span id="data">10/06/2026</span>
            </div>
        </div>

        <div class="field">
            <label for="hora">Hora</label>
            <div class="select-box">
                <span id="hora">10:00</span>
            </div>
        </div>
        <button class="btn-confirmar">Confirmar Agendamento</button>
    </div>

    <div class="navbar">
        <div class="tab-item">
            <span class="tab-icon"></span>
            <span>Consultas</span>
        </div>
        <div class="tab-item">
            <span class="tab-icon"></span>
            <span>Próximas</span>
        </div>
        <div class="tab-item">
            <span class="tab-icon"></span>
            <span>Início</span>
        </div>
        <div class="tab-item active">
            <span class="tab-icon"></span>
            <span>Agendar</span>
        </div>
        <div class="tab-item">
            <span class="tab-icon"></span>
            <span>Config</span>
        </div>
    </div>
</div>

</body>
</html>
