<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurações</title>

    <link rel="stylesheet" href="style.css">

    <!-- Ícones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<main class="app">

    <!-- CONTEÚDO -->
    <section class="conteudo">

        <h1>Opções</h1>

        <div class="opcoes">

            <button class="opcao">
                <span class="icone">🔒</span>
                <span class="texto">Alterar senha</span>
                <i class="fa-solid fa-chevron-right seta"></i>
            </button>

            <button class="opcao">
                <span class="icone">🔔</span>
                <span class="texto">Notificações</span>
                <i class="fa-solid fa-chevron-right seta"></i>
            </button>

            <button class="opcao">
                <span class="icone">🔐</span>
                <span class="texto">Privacidade</span>
                <i class="fa-solid fa-chevron-right seta"></i>
            </button>

            <button class="opcao">
                <span class="icone ajuda">?</span>
                <span class="texto">Ajuda e suporte</span>
                <i class="fa-solid fa-chevron-right seta"></i>
            </button>

        </div>

        <!-- SAIR -->
        <button class="btn-sair">
            <span class="icone-sair">➡</span>
            <span>Sair</span>
        </button>

    </section>


    <!-- MENU INFERIOR -->
    <nav class="menu-inferior">

        <a href="#" class="item-menu">
            <i class="fa-solid fa-check"></i>
            <span>Consultas</span>
        </a>

        <a href="#" class="item-menu">
            <i class="fa-regular fa-calendar"></i>
            <span>Próximas</span>
        </a>

        <a href="#" class="item-menu">
            <i class="fa-solid fa-house"></i>
            <span>Início</span>
        </a>

        <a href="#" class="item-menu">
            <i class="fa-solid fa-stethoscope"></i>
            <span>Agendar</span>
        </a>

        <a href="#" class="item-menu ativo">
            <i class="fa-solid fa-gear"></i>
            <span>Config</span>
        </a>

    </nav>

</main>

</body>

</html>
