<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações | Saúde+</title>
    <link rel="stylesheet" href="../../recursos/css/style-global.css" />
    <link rel="stylesheet" href="../../recursos/css/dashboard-paciente.css" />
    <link rel="stylesheet" href="configuracoes.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-regular fa-heart"></i> Saúde<span>+</span>
        </div>

        <div class="patient-card">
          <strong id="sidebar-nome">Carregando...</strong>
          <span id="sidebar-desde"></span>
        </div>

        <nav>
          <a href="../inicio/inicio.html"><span class="dot"></span> Início</a>
          <a href="../agendar-consulta/agendar-consulta.html"
            ><span class="dot"></span> Agendar consulta</a
          >
          <a href="../historico/historico.html"
            ><span class="dot"></span> Histórico</a
          >
          <a href="configuracoes.html" class="ativo"
            ><span class="dot"></span> Configurações</a
          >
        </nav>

        <hr class="divider" />
        <button class="logout" id="btn-logout">Sair da conta</button>
      </aside>

      <main class="dashboard-content">
        <div class="topbar">
          <a
            href="../../telas-comuns/menu-inicial/menu_inicial.html"
            class="voltar"
          >
            <i class="fa-solid fa-arrow-left"></i> Voltar ao menu inicial
          </a>
          <div class="topbar-actions">
            <button class="icon-btn" title="Notificações">
              <i class="fa-regular fa-bell"></i>
            </button>
            <a
              href="../agendar-consulta/agendar-consulta.html"
              class="btn-primary"
            >
              <i class="fa-solid fa-plus"></i> Nova consulta
            </a>
          </div>
        </div>

        <h1 class="page-title">Configurações</h1>
        <p class="page-subtitle">
          Atualize seus dados pessoais e escolha como quer receber avisos da
          plataforma.
        </p>

        <div class="config-grid">
          <section class="panel">
            <h2 style="margin-bottom: 16px">Dados do paciente</h2>
            <form id="form-perfil">
              <div class="campo-linha">
                <div class="campo">
                  <label for="nome">Nome completo</label>
                  <input type="text" id="nome" name="nome" required />
                </div>
                <div class="campo">
                  <label for="cpf">CPF</label>
                  <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    disabled
                  />
                </div>
                <div class="campo">
                  <label for="telefone">Telefone</label>
                  <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(11) 98765-4321"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn-primary btn-full"
                id="btn-salvar"
              >
                <i class="fa-regular fa-floppy-disk"></i> Salvar alterações
              </button>

              <p class="estado" id="mensagem-perfil" style="display: none"></p>
            </form>
          </section>

          <section class="panel preferencias-panel">
            <h2 style="margin-bottom: 14px">Preferências</h2>

            <label class="preferencia-item">
              <div>
                <strong>Lembretes por e-mail</strong>
                <span>Receber avisos das consultas</span>
              </div>
              <input type="checkbox" id="pref-email" class="toggle" checked />
            </label>

            <label class="preferencia-item">
              <div>
                <strong>SMS de confirmação</strong>
                <span>Confirmar horários pelo celular</span>
              </div>
              <input type="checkbox" id="pref-sms" class="toggle" checked />
            </label>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
