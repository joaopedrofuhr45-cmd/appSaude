<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela login</title>

    <link rel="stylesheet" href="../../recursos/css/style-global.css" />
    <link rel="stylesheet" href="login.css" />

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
</head>

<body>
<!-- HEADER -->
<header class="topo">
    <a href="../../telas-comuns/menu-inicial/menu_inicial.html" class="botao-voltar">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Voltar</span>
    </a>

    <div class="logo">


        <span> Saúde<span class="mais">+</span> </span>
    </div>
</header>

    <main class="login-screen">
      <div class="login-illustration">
        <img
          src="../../recursos/img/saude_em_um_so_lugar.png"
          alt="Sua saúde em um só lugar"
        />
      </div>

      <div class="login-card">
        <div class="login-tag"><i class="fa-solid fa-user"></i> Acesso do paciente</div>

        <h1 class="login-title">Entrar na sua conta</h1>
        <p class="login-subtitle">Acesse sua área de saúde.</p>

        <form id="loginForm">
          <div class="login-field">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" />
          </div>

          <div class="login-field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" />
          </div>

          <p id="mensagem" class="login-error"></p>

          <button type="submit" class="login-submit">Entrar</button>
        </form>

        <p class="login-footer">
          Não tem uma conta?
          <a href="../cadastro-paciente/cadastro-paciente.html">Criar conta</a>
        </p>
      </div>
</main>

<script type="module" src="login.js"></script>
</body>
</html>
