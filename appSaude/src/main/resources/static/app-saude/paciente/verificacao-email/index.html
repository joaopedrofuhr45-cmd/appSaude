<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de e-mail</title>
    <link rel="stylesheet" href="../../shared/css/style-global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="card">
    <h1 class="title">Verificação de e-mail</h1>
    <p>Enviamos um código de 6 dígitos para o seu e-mail. Digite-o abaixo para continuar.</p>

    <form id="form-verificacao">
        <div class="form">
            <input type="text" name="codigo" placeholder="Código de verificação" inputmode="numeric" maxlength="6" required>
        </div>

        <p id="mensagem-erro" class="mensagem-erro"></p>

        <button type="submit" class="btn">Confirmar</button>
    </form>

    <button type="button" id="btn-reenviar" class="btn-link">Reenviar código</button>
</main>

<script type="module" src="./script.js"></script>

</body>
</html>
