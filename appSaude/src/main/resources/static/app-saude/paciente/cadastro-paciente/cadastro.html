<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../recursos/css/style-global.css">
</head>

<body>
  <main>
    <section>
      <div class="cadastro">
        <div>
          <progress id="progress-cadastro" value="50%" max="100%"></progress>
        </div>
      </div>
      <div class="informacoes">
        <div class="info">
          <div class="icon">
            <i class="fa-solid fa-heart-pulse"></i>
          </div>
          <div class="title">
            <h2>Acompanhe sua saúde</h2>
          </div>
          <div class="description">
            <p>Veja seus históricos, exames, medicamentos e acompanhe sua evolução.</p>
          </div>
        </div>
      </div>

      </div>
      <div class="informacoes">
        <div class="info">
          <div class="icon">
            <i class="fa-solid fa-file-lines"></i>
          </div>
          <div class="title">
            <h2>Organize seus documentos</h2>
          </div>
          <div class="description">
            <p>Tenha seus laudos, receitas e documentos sempre à mão, com segurança.</p>
          </div>
        </div>
      </div>

      </div>
      <div class="informacoes">
        <div class="info">
          <div class="icon">
            <i class="fa-solid fa-user-doctor"></i>
          </div>
          <div class="title">
            <h2>Conecte-se com profissionais</h2>
          </div>
          <div class="description">
            <p>Encontre especialistas, agende consultas e tire suas dúvidas com mais facilidade.</p>
          </div>
        </div>
      </div>

    </section>
  </main>
</body>

</html>
