<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fundo Circular Azul -->
  <circle cx="250" cy="250" r="230" fill="#1C5376" />
  
  <!-- Moldura do Calendário -->
  <rect x="110" y="110" width="280" height="280" rx="35" ry="35" 
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" />
        
  <!-- Linha Divisória do Cabeçalho -->
  <line x1="110" y1="185" x2="390" y2="185" stroke="#FFFFFF" stroke-width="14" />
  
  <!-- Pinos / Alças de Suspensão -->
  <line x1="180" y1="85" x2="180" y2="115" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <line x1="320" y1="85" x2="320" y2="115" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  
  <!-- Grade de Dias (Pontos Círculos Preenchidos) -->
  <!-- Linha 1 -->
  <circle cx="295" cy="235" r="13" fill="#FFFFFF" />
  <circle cx="350" cy="235" r="13" fill="#FFFFFF" />
  
  <!-- Linha 2 -->
  <circle cx="185" cy="290" r="13" fill="#FFFFFF" />
  <circle cx="240" cy="290" r="13" fill="#FFFFFF" />
  <circle cx="295" cy="290" r="13" fill="#FFFFFF" />
  <circle cx="350" cy="290" r="13" fill="#FFFFFF" />
  
  <!-- Linha 3 -->
  <circle cx="185" cy="345" r="13" fill="#FFFFFF" />
  <circle cx="240" cy="345" r="13" fill="#FFFFFF" />
  <circle cx="295" cy="345" r="13" fill="#FFFFFF" />
</svg>