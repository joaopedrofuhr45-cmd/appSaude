<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Saúde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="box">
    <div class="logo">
      <div class="logo-icon">
        <img src="icons/heart.svg" alt="">
      </div>
      <h1>App Saúde</h1>
      <p>Escolha como deseja acessar</p>
    </div>

    <div class="list">
      <a href="../medico/login/index.html" class="card">
        <div class="icon">
          <img src="icons/stethoscope.svg" alt="">
        </div>
        <div class="text">
          <h2>Sou Médico</h2>
          <p>Acessar minha agenda de consultas</p>
        </div>
      </a>

      <a href="../atendente/login/index.html" class="card">
        <div class="icon">
          <img src="icons/users.svg" alt="">
        </div>
        <div class="text">
          <h2>Sou Atendente</h2>
          <p>Gerenciar consultas do dia</p>
        </div>
      </a>

      <a href="../paciente/cadastro/index.html" class="card highlight">
        <div class="icon">
          <img src="icons/user-plus.svg" alt="">
        </div>
        <div class="text">
          <h2>Sou Paciente</h2>
          <p>Criar minha conta e agendar consultas</p>
        </div>
      </a>
    </div>

    <p class="footer">
      Já é paciente cadastrado? <a href="../paciente/login/index.html">Fazer login</a>
    </p>
  </main>
</body>
</html>
